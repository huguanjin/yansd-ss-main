<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>初始设置 - SS 管理面板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:40px;width:420px}
h1{text-align:center;margin-bottom:8px;font-size:22px;color:#333}
.desc{text-align:center;color:#999;font-size:13px;margin-bottom:24px}
label{display:block;font-size:13px;color:#666;margin-bottom:6px;margin-top:16px}
input{width:100%;padding:12px 16px;border:1px solid #d9d9d9;border-radius:8px;font-size:14px;outline:none;transition:border .2s}
input:focus{border-color:#1677ff}
.hint{font-size:12px;color:#999;margin-top:4px}
button{width:100%;padding:12px;background:#1677ff;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;margin-top:24px;transition:background .2s}
button:hover{background:#4096ff}
button:disabled{background:#a0c4ff;cursor:not-allowed}
.err{color:#ff4d4f;font-size:13px;margin-top:10px;text-align:center;display:none}
.ok{color:#52c41a;font-size:13px;margin-top:10px;text-align:center;display:none}
</style>
</head>
<body>
<div class="card">
  <h1>⚙️ 初始设置</h1>
  <p class="desc">首次使用，请配置管理员密码和数据库连接</p>
  <form id="setupForm">
    <label>管理员密码</label>
    <input type="password" id="s_pwd" placeholder="设置管理面板登录密码" required minlength="4" autocomplete="new-password">

    <label>确认密码</label>
    <input type="password" id="s_pwd2" placeholder="再次输入密码" required minlength="4" autocomplete="new-password">

    <label>MongoDB 连接字符串</label>
    <input type="text" id="s_mongo" placeholder="mongodb+srv://user:pass@cluster0.xxx.mongodb.net/" required>
    <p class="hint">示例: mongodb+srv://user:pass@host/ 或 mongodb://host:27017/</p>

    <label>数据库名称</label>
    <input type="text" id="s_dbname" placeholder="yansd-ss" value="yansd-ss">
    <p class="hint">留空默认为 yansd-ss</p>

    <button type="submit" id="submitBtn">完成设置</button>
    <p class="err" id="err"></p>
    <p class="ok" id="ok"></p>
  </form>
</div>
<script>
document.getElementById("setupForm").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  const ok = document.getElementById("ok");
  err.style.display = "none";
  ok.style.display = "none";

  const pwd = document.getElementById("s_pwd").value;
  const pwd2 = document.getElementById("s_pwd2").value;
  const mongo = document.getElementById("s_mongo").value.trim();

  if (pwd !== pwd2) {
    err.textContent = "两次密码不一致";
    err.style.display = "block";
    return;
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "正在连接数据库…";

  try {
    const res = await fetch("/api/setup", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({password: pwd, mongo_uri: mongo, db_name: document.getElementById('s_dbname').value.trim()})
    });
    const data = await res.json();
    if (res.ok) {
      ok.textContent = "设置成功，正在跳转…";
      ok.style.display = "block";
      setTimeout(() => location.href = "/login", 1000);
    } else {
      err.textContent = data.error || "设置失败";
      err.style.display = "block";
    }
  } catch (ex) {
    err.textContent = "请求失败: " + ex.message;
    err.style.display = "block";
  } finally {
    btn.disabled = false;
    btn.textContent = "完成设置";
  }
});
</script>
</body>
</html>

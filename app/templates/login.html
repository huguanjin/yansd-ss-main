<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - SS 管理面板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:40px;width:360px}
h1{text-align:center;margin-bottom:24px;font-size:22px;color:#333}
input{width:100%;padding:12px 16px;border:1px solid #d9d9d9;border-radius:8px;font-size:15px;outline:none;transition:border .2s}
input:focus{border-color:#1677ff}
button{width:100%;padding:12px;background:#1677ff;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;margin-top:16px;transition:background .2s}
button:hover{background:#4096ff}
.err{color:#ff4d4f;font-size:13px;margin-top:10px;text-align:center;display:none}
</style>
</head>
<body>
<div class="card">
  <h1>🔐 SS 管理面板</h1>
  <form id="form">
    <input type="password" id="pwd" placeholder="管理密码" autocomplete="current-password" required>
    <button type="submit">登 录</button>
    <p class="err" id="err"></p>
  </form>
</div>
<script>
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.style.display = "none";
  const res = await fetch("/api/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({password: document.getElementById("pwd").value})
  });
  if (res.ok) { location.href = "/"; }
  else {
    const d = await res.json();
    if (res.status === 503) { location.href = "/setup"; return; }
    err.textContent = d.error || "登录失败"; err.style.display = "block";
  }
});
</script>
</body>
</html>
